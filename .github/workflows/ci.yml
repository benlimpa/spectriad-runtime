name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install .
      - name: Import needs no Java
        run: |
          python -c "import spectriad_runtime; print(spectriad_runtime.__version__)"
          spectriad-runtime --version
      - name: Run tests
        run: python -m unittest discover -s tests -v
