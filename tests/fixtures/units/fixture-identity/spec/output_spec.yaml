docs:
  constraints:
  - id: O1
    nl: DS_O1
    name: arith-preserved
    trigger: '{id="out"}'
    rule: ops_preserved("arith.*")
    provenance: fixture
  - id: O2
    nl: DS_O2
    name: one-function
    trigger: '{id="out"}'
    rule: adhoc("one_function")
    check_kind: python
    check_code: |
      def check(inp, out, lib):
          funcs = [op for op in out.ops if op.name == "func.func"]
          if len(funcs) != 1:
              return (False, "expected exactly one func.func", [])
          return (True, "one func.func", [])
    provenance: fixture
